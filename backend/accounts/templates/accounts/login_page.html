<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - معهد تحفيظ القرآن الكريم</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a5e1a;
            --secondary-color: #2e7d32;
            --accent-color: #4caf50;
            --light-color: #e8f5e9;
            --dark-color: #0d3b0d;
        }
        
        body {
            background-color: #f5f9f5;
            background-image: linear-gradient(135deg, #f5f9f5 0%, #e0f2e1 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .login-card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .login-card:hover {
            transform: translateY(-5px);
        }
        
        .login-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            text-align: center;
            padding: 25px 20px;
            position: relative;
        }
        
        .login-header h3 {
            margin: 0;
            font-weight: 600;
        }
        
        .login-header i {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: block;
        }
        
        .login-header::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 20px;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 10" xmlns="http://www.w3.org/2000/svg"><path d="M0 0 Q 25 10, 50 0 Q 75 10, 100 0 L 100 10 L 0 10 Z" fill="white"/></svg>');
            background-size: 100% 100%;
        }
        
        .login-body {
            padding: 30px;
        }
        
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #ddd;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }
        
        .input-group-text {
            background-color: var(--light-color);
            border: 1px solid #ddd;
            border-radius: 8px 0 0 8px;
            color: var(--primary-color);
        }
        
        .btn-login {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
        }
        
        .btn-login:hover {
            background: linear-gradient(to right, var(--dark-color), var(--primary-color));
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .form-check-label {
            color: #555;
        }
        
        .forgot-link {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .forgot-link:hover {
            text-decoration: underline;
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #888;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }
        
        .divider::before {
            margin-right: 10px;
        }
        
        .divider::after {
            margin-left: 10px;
        }
        
        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .social-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            border: none;
            transition: all 0.3s;
        }
        
        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }
        
        .facebook {
            background-color: #3b5998;
        }
        
        .twitter {
            background-color: #1da1f2;
        }
        
        .google {
            background-color: #dd4b39;
        }
        
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.95rem;
        }
        
        .register-link a {
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 0.85rem;
        }
        
        @media (max-width: 576px) {
            .login-container {
                padding: 0 15px;
            }
            
            .login-body {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-book-quran"></i>
                <h3>تسجيل الدخول إلى المعهد</h3>
                <p>معهد تحفيظ القرآن الكريم</p>
            </div>
            
            <div class="login-body">
                <form>
                    <div class="mb-3">
                        <label for="username" class="form-label">اسم المستخدم</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" id="username" placeholder="أدخل اسم المستخدم" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">كلمة المرور</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="أدخل كلمة المرور" required>
                        </div>
                    </div>
                    
                    <div class="remember-forgot">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label" for="remember">تذكرني</label>
                        </div>
                        <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
                    </div>
                    
                    <button type="submit" class="btn btn-login">تسجيل الدخول</button>
                    
                    <div class="divider">أو الدخول باستخدام</div>
                    
                    <div class="social-login">
                        <button type="button" class="social-btn facebook"><i class="fab fa-facebook-f"></i></button>
                        <button type="button" class="social-btn twitter"><i class="fab fa-twitter"></i></button>
                        <button type="button" class="social-btn google"><i class="fab fa-google"></i></button>
                    </div>
                    
                    <div class="register-link">
                        ليس لديك حساب؟ <a href="#">سجل الآن</a>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="footer">
            © 2023 معهد تحفيظ القرآن الكريم. جميع الحقوق محفوظة.
        </div>
    </div>
    
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
  document.querySelector('.login-body form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      alert('يرجى ملء جميع الحقول');
      return;
    }

    try {
      // 1) احصل على التوكن من السيرفر
      const tokenRes = await fetch('http://localhost:8000/api/token/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (!tokenRes.ok) throw new Error('بيانات غير صحيحة');

      const { access, refresh } = await tokenRes.json();

      // 2) خزّن التوكن في localStorage
      localStorage.setItem('access_token', access);
      localStorage.setItem('refresh_token', refresh);

      // 3) استعلم عن بيانات المستخدم لمعرفة دوره
      const meRes = await fetch('http://localhost:8000/api/users/me/', {
        headers: { 'Authorization': `Bearer ${access}` }
      });

      if (!meRes.ok) throw new Error('فشل في جلب بيانات المستخدم');

      const user = await meRes.json();
      const role = user.role; // افترضنا أن الـ serializer لــ /users/me/ يحتوي حقل "role"

      // 4) إعادة التوجيه حسب الدور
      switch(role) {
        case 'admin':
          window.location.href = '/admin-dashboard/';
          break;
        case 'teacher':
          window.location.href = '/teacher/';
          break;
        case 'supervisor':
          window.location.href = '/halaqas/supervisor/';
          break;
        case 'parent':
          window.location.href = '/parent/';
          break;
        default:
          alert('دور غير معرّف');
      }

    } catch (err) {
      console.error(err);
      alert('فشل تسجيل الدخول: ' + err.message);
    }
  });
</script>

</body>
</html>
