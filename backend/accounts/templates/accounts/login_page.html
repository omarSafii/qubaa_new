<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - معهد قباء</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --color-primary: #0B3C54;
      --color-secondary: #31617F;
      --color-accent: #968960;
      --color-light: #F2D8A1;
      --shadow-soft: 0 18px 45px rgba(11, 60, 84, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(11, 60, 84, 0.96), rgba(49, 97, 127, 0.9)),
        linear-gradient(45deg, #f8f9fa, #eef3f5);
      color: var(--color-primary);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .login-shell {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: #fff;
      box-shadow: var(--shadow-soft);
    }

    .login-header {
      padding: 28px 24px 24px;
      color: #fff;
      text-align: center;
      background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));
    }

    .logo-mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--color-light), var(--color-accent));
      color: #fff;
      font-size: 1.55rem;
    }

    .login-header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    .login-header p {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.95rem;
    }

    .login-body {
      padding: 24px;
    }

    .form-label {
      font-weight: 700;
      color: var(--color-primary);
    }

    .input-group-text {
      min-width: 44px;
      justify-content: center;
      border-color: rgba(11, 60, 84, 0.14);
      background: rgba(242, 216, 161, 0.24);
      color: var(--color-primary);
    }

    .form-control {
      min-height: 48px;
      border-color: rgba(11, 60, 84, 0.14);
    }

    .form-control:focus {
      border-color: var(--color-secondary);
      box-shadow: 0 0 0 0.2rem rgba(49, 97, 127, 0.16);
    }

    .btn-login {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));
      color: #fff;
      font-weight: 800;
    }

    .btn-login:hover,
    .btn-login:focus {
      color: #fff;
      opacity: 0.96;
    }

    .login-note {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(242, 216, 161, 0.26);
      color: #5b5138;
      font-size: 0.92rem;
      line-height: 1.7;
    }

    .footer-note {
      margin-top: 16px;
      text-align: center;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.86rem;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .login-body {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-label="تسجيل الدخول">
      <div class="login-header">
        <div class="logo-mark"><i class="fas fa-book-quran"></i></div>
        <h1>تسجيل الدخول</h1>
        <p>معهد قباء لتحفيظ القرآن الكريم</p>
      </div>

      <div class="login-body">
        {% if error %}
          <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
          {% endif %}

          <div class="mb-3">
            <label class="form-label" for="username">اسم الأستاذ أو اسم المستخدم</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-user"></i></span>
              <input class="form-control" id="username" name="username" type="text" autocomplete="username" placeholder="اسم الأستاذ أو اسم المستخدم" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">كلمة المرور</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock"></i></span>
              <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
          </div>

          <button class="btn btn-login" type="submit">دخول</button>
        </form>

        <div class="login-note">
          رابط الدخول مخصص للأساتذة والمشرفين. الرجاء عدم مشاركة بيانات الدخول.
        </div>
      </div>
    </section>

    <div class="footer-note">© معهد قباء</div>
  </main>
</body>
</html>
