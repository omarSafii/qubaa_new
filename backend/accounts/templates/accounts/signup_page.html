<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التسجيل - معهد تحفيظ القرآن الكريم</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a5e1a;
            --secondary-color: #2e7d32;
            --accent-color: #4caf50;
            --light-color: #e8f5e9;
            --dark-color: #0d3b0d;
        }
        
        body {
            background-color: #f5f9f5;
            background-image: linear-gradient(135deg, #f5f9f5 0%, #e0f2e1 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23f5f9f5"/><path d="M28,28 Q50,10 72,28 T100,50 Q90,72 72,72 T28,72 Q10,50 28,28Z" fill="%23e0f2e1" opacity="0.3"/></svg>');
            background-size: 400px;
        }
        
        .register-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .register-card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.4s ease;
        }
        
        .register-card:hover {
            transform: translateY(-8px);
        }
        
        .register-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            text-align: center;
            padding: 30px 20px;
            position: relative;
        }
        
        .register-header h2 {
            margin: 0;
            font-weight: 700;
            font-size: 2.2rem;
        }
        
        .register-header i {
            font-size: 3.5rem;
            margin-bottom: 20px;
            display: block;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        
        .register-header p {
            margin: 10px 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .register-header::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 20px;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 10" xmlns="http://www.w3.org/2000/svg"><path d="M0 0 Q 25 10, 50 0 Q 75 10, 100 0 L 100 10 L 0 10 Z" fill="white"/></svg>');
            background-size: 100% 100%;
        }
        
        .register-body {
            padding: 30px;
        }
        
        .form-section-title {
            color: var(--primary-color);
            border-right: 4px solid var(--accent-color);
            padding-right: 12px;
            margin: 25px 0 20px;
            font-weight: 600;
            font-size: 1.3rem;
        }
        
        .form-row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -10px;
        }
        
        .form-group {
            padding: 0 10px;
            flex: 1 0 250px;
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #444;
        }
        
        .form-control {
            border-radius: 8px;
            padding: 14px 16px;
            border: 1px solid #ddd;
            transition: all 0.3s;
            width: 100%;
            font-size: 1rem;
        }
        
        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }
        
        .input-group {
            position: relative;
        }
        
        .input-group-text {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            font-size: 1.1rem;
        }
        
        .input-icon {
            padding-left: 45px;
        }
        
        .form-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%231a5e1a' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
            background-size: 16px 12px;
        }
        
        .btn-register {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-weight: 600;
            width: 100%;
            font-size: 1.1rem;
            transition: all 0.3s;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }
        
        .btn-register:hover {
            background: linear-gradient(to right, var(--dark-color), var(--primary-color));
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .terms {
            display: flex;
            align-items: flex-start;
            margin: 20px 0;
        }
        
        .terms input {
            margin-top: 5px;
            margin-left: 10px;
        }
        
        .terms label {
            color: #555;
            font-size: 0.95rem;
        }
        
        .terms a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        .terms a:hover {
            text-decoration: underline;
        }
        
        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 1rem;
            color: #555;
        }
        
        .login-link a {
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
            margin-right: 5px;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #777;
            font-size: 0.9rem;
        }
        
        .decoration {
            position: absolute;
            font-size: 7rem;
            opacity: 0.05;
            color: var(--primary-color);
            z-index: 0;
        }
        
        .dec-1 {
            top: 20px;
            right: 30px;
            transform: rotate(15deg);
        }
        
        .dec-2 {
            bottom: 20px;
            left: 30px;
            transform: rotate(-15deg);
        }
        
        @media (max-width: 768px) {
            .register-container {
                padding: 0 15px;
            }
            
            .register-body {
                padding: 20px;
            }
            
            .form-group {
                flex: 1 0 100%;
            }
            
            .register-header h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="decoration dec-1">
        <i class="fas fa-mosque"></i>
    </div>
    
    <div class="decoration dec-2">
        <i class="fas fa-book-quran"></i>
    </div>
    
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <i class="fas fa-mosque"></i>
                <h2>التسجيل في معهد تحفيظ القرآن الكريم</h2>
                <p>انضم إلى مجتمع حفاظ كتاب الله تعالى</p>
            </div>
            
            <div class="register-body">
                <form>
                    <h3 class="form-section-title">المعلومات الشخصية</h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">الاسم الأول</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control input-icon" placeholder="أدخل الاسم الأول" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">اسم الأب</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control input-icon" placeholder="أدخل اسم الأب" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">اسم الجد</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control input-icon" placeholder="أدخل اسم الجد" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">اسم العائلة</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-users"></i></span>
                                <input type="text" class="form-control input-icon" placeholder="أدخل اسم العائلة" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">تاريخ الميلاد</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-calendar"></i></span>
                                <input type="date" class="form-control input-icon" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">الجنس</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-venus-mars"></i></span>
                                <select class="form-select input-icon" required>
                                    <option value="" selected disabled>اختر الجنس</option>
                                    <option value="male">ذكر</option>
                                    <option value="female">أنثى</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">البلد</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-globe-asia"></i></span>
                                <select class="form-select input-icon" required>
                                    <option value="" selected disabled>اختر البلد</option>
                                    <option value="sa">السعودية</option>
                                    <option value="eg">مصر</option>
                                    <option value="jo">الأردن</option>
                                    <option value="ae">الإمارات</option>
                                    <option value="qa">قطر</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <h3 class="form-section-title">معلومات الاتصال</h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">رقم الجوال</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-mobile-alt"></i></span>
                                <input type="tel" class="form-control input-icon" placeholder="أدخل رقم الجوال" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">البريد الإلكتروني</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control input-icon" placeholder="أدخل البريد الإلكتروني" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">المدينة</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-city"></i></span>
                                <input type="text" class="form-control input-icon" placeholder="أدخل المدينة" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">الحي</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
                                <input type="text" class="form-control input-icon" placeholder="أدخل اسم الحي" required>
                            </div>
                        </div>
                    </div>
                    
                    <h3 class="form-section-title">معلومات الحساب</h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">اسم المستخدم</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user-tag"></i></span>
                                <input type="text" class="form-control input-icon" placeholder="اختر اسم مستخدم" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">كلمة المرور</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control input-icon" placeholder="أنشئ كلمة مرور قوية" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">تأكيد كلمة المرور</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control input-icon" placeholder="أعد إدخال كلمة المرور" required>
                            </div>
                        </div>
                    </div>
                    
                    <h3 class="form-section-title">المعلومات التعليمية</h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">المستوى التعليمي</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-graduation-cap"></i></span>
                                <select class="form-select input-icon" required>
                                    <option value="" selected disabled>اختر المستوى التعليمي</option>
                                    <option value="primary">ابتدائي</option>
                                    <option value="middle">متوسط</option>
                                    <option value="high">ثانوي</option>
                                    <option value="university">جامعي</option>
                                    <option value="postgrad">دراسات عليا</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">المسار التعليمي</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-book-open"></i></span>
                                <select class="form-select input-icon" required>
                                    <option value="" selected disabled>اختر المسار التعليمي</option>
                                    <option value="memorization">حفظ القرآن الكريم</option>
                                    <option value="tajweed">تجويد القرآن الكريم</option>
                                    <option value="recitation">تلاوة القرآن الكريم</option>
                                    <option value="interpretation">تفسير القرآن الكريم</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">ملاحظات إضافية</label>
                        <textarea class="form-control" rows="3" placeholder="أي ملاحظات أو معلومات إضافية تود إضافتها"></textarea>
                    </div>
                    
                    <div class="terms">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">أوافق على <a href="#">الشروط والأحكام</a> و <a href="#">سياسة الخصوصية</a> للمعهد</label>
                    </div>
                    
                    <button type="submit" class="btn btn-register">
                        <i class="fas fa-user-plus"></i> إنشاء حساب جديد
                    </button>
                    
                    <div class="login-link">
                        لديك حساب بالفعل؟ <a href="#">سجل الدخول الآن</a>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="footer">
            © 2023 معهد تحفيظ القرآن الكريم. جميع الحقوق محفوظة.<br>
            صمم بعناية لخدمة كتاب الله تعالى
        </div>
    </div>
    
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
